services:
  - type: web
    name: buildconnect-preview
    runtime: docker
    plan: free
    region: oregon
    branch: codex/hosted-preview
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: BUILDCONNECT_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: buildconnect-preview-db
          property: connectionString

databases:
  - name: buildconnect-preview-db
    plan: free
    region: oregon
    databaseName: buildconnect_preview
    user: buildconnect_preview
    ipAllowList: []
